name: CLI Compatibility Matrix

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: porch-kind
  KIND_CONTEXT_NAME: porch-test
  PORCH_SERVER_IMAGE: porch-server
  PORCH_CONTROLLERS_IMAGE: porch-controllers
  PORCH_FUNCTION_RUNNER_IMAGE: porch-function-runner
  PORCH_WRAPPER_SERVER_IMAGE: porch-wrapper-server

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the last 3 published releases and build the server matrix
  # ---------------------------------------------------------------------------
  resolve-versions:
    name: Resolve Versions
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.releases.outputs.versions }}
      server_matrix: ${{ steps.matrix.outputs.server_matrix }}
    steps:
      - name: Get last 3 releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: nephio-project/porch
        run: |
          # Always query upstream repo for releases (works correctly from forks)
          VERSIONS=$(gh api repos/${UPSTREAM_REPO}/releases \
            --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0:3] | [.[].tag_name]')
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Resolved releases: ${VERSIONS}"

      - name: Build server matrix
        id: matrix
        run: |
          RELEASES='${{ steps.releases.outputs.versions }}'
          # One runner per server version (latest + 3 releases)
          SERVER_MATRIX=$(echo "$RELEASES" | jq -c '{include: ([{server_version: "latest"}] + [.[] | {server_version: .}])}')
          echo "server_matrix=${SERVER_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Server matrix:"
          echo "$SERVER_MATRIX" | jq .

  # ---------------------------------------------------------------------------
  # 2. Build the latest server images from the current branch
  # ---------------------------------------------------------------------------
  build-latest-server:
    name: Build Latest Server Images
    runs-on: ubuntu-latest
    needs: resolve-versions
    timeout-minutes: 15
    env:
      IMAGE_TAG: latest
    steps:
      - name: Checkout Porch
        uses: actions/checkout@v4
      - name: Set up Go
        uses: ./.github/actions/setup-go-kpt
        with:
          install-kpt: "false"
          go-cache: "true"
      - name: Set build variables
        id: vars
        run: |
          echo "alpine-version=$(make --eval='print: ; @echo $(ALPINE_VERSION)' print)" >> $GITHUB_OUTPUT
          echo "golang-bookworm=$(make --eval='print: ; @echo $(GOLANG_BOOKWORM_VERSION)' print)" >> $GITHUB_OUTPUT
          echo "golang-alpine=$(make --eval='print: ; @echo $(GOLANG_ALPINE_VERSION)' print)" >> $GITHUB_OUTPUT
      - name: Build images
        run: |
          set -e
          export ALPINE_VERSION=${{ steps.vars.outputs.alpine-version }}
          export GOLANG_BOOKWORM_VERSION=${{ steps.vars.outputs.golang-bookworm }}
          export GOLANG_ALPINE_VERSION=${{ steps.vars.outputs.golang-alpine }}
          IMAGE_NAME=${PORCH_FUNCTION_RUNNER_IMAGE} WRAPPER_SERVER_IMAGE_NAME=${PORCH_WRAPPER_SERVER_IMAGE} make -C func/ build-image &
          pid1=$!
          IMAGE_NAME=${PORCH_SERVER_IMAGE} make -C build/ build-image &
          pid2=$!
          IMAGE_NAME=${PORCH_CONTROLLERS_IMAGE} make -C controllers/ build-image &
          pid3=$!
          wait $pid1 && wait $pid2 && wait $pid3
      - name: Save images
        run: |
          docker save \
            ${IMAGE_REPO}/${PORCH_SERVER_IMAGE}:${IMAGE_TAG} \
            ${IMAGE_REPO}/${PORCH_CONTROLLERS_IMAGE}:${IMAGE_TAG} \
            ${IMAGE_REPO}/${PORCH_FUNCTION_RUNNER_IMAGE}:${IMAGE_TAG} \
            ${IMAGE_REPO}/${PORCH_WRAPPER_SERVER_IMAGE}:${IMAGE_TAG} \
            | gzip > porch-images-latest.tar.gz
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: porch-images-latest
          path: porch-images-latest.tar.gz
          compression-level: 0
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. Build the latest porchctl from the current branch
  # ---------------------------------------------------------------------------
  build-latest-cli:
    name: Build Latest CLI
    runs-on: ubuntu-latest
    needs: resolve-versions
    timeout-minutes: 10
    steps:
      - name: Checkout Porch
        uses: actions/checkout@v4
      - name: Set up Go
        uses: ./.github/actions/setup-go-kpt
        with:
          install-kpt: "false"
          go-cache: "true"
      - name: Build porchctl
        run: make porchctl
      - name: Upload porchctl
        uses: actions/upload-artifact@v4
        with:
          name: porchctl-latest
          path: .build/porchctl
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 4. One runner per server version — tests all CLI versions sequentially
  # ---------------------------------------------------------------------------
  compat-test:
    name: "Server ${{ matrix.server_version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [resolve-versions, build-latest-server, build-latest-cli]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-versions.outputs.server_matrix) }}
    env:
      RELEASES: ${{ needs.resolve-versions.outputs.releases }}
    steps:
      - name: Checkout Porch
        uses: actions/checkout@v4

      - name: Set up Go and kpt
        uses: ./.github/actions/setup-go-kpt
        with:
          go-cache: "true"

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          install_only: true

      - name: Set up Git config
        run: |
          git config --global user.name "Porch Compat"
          git config --global user.email "porch-compat@porch.dev"

      - name: Setup dev env (kind + gitea + MetalLB)
        run: ${GITHUB_WORKSPACE}/scripts/setup-dev-env.sh

      # --- Deploy the server (once per runner) ---

      - name: Download latest server images
        if: matrix.server_version == 'latest'
        uses: actions/download-artifact@v4
        with:
          name: porch-images-latest
      - name: Load and deploy latest server
        if: matrix.server_version == 'latest'
        run: |
          gunzip -c porch-images-latest.tar.gz | docker load
          kind load docker-image ${IMAGE_REPO}/${PORCH_SERVER_IMAGE}:latest -n ${KIND_CONTEXT_NAME}
          kind load docker-image ${IMAGE_REPO}/${PORCH_CONTROLLERS_IMAGE}:latest -n ${KIND_CONTEXT_NAME}
          kind load docker-image ${IMAGE_REPO}/${PORCH_FUNCTION_RUNNER_IMAGE}:latest -n ${KIND_CONTEXT_NAME}
          kind load docker-image ${IMAGE_REPO}/${PORCH_WRAPPER_SERVER_IMAGE}:latest -n ${KIND_CONTEXT_NAME}
          IMAGE_TAG=latest SKIP_IMG_BUILD=true SKIP_LOCAL_GIT=true \
            PORCH_CACHE_TYPE=DB \
            make deployment-config deploy-current-config

      - name: Deploy released server ${{ matrix.server_version }}
        if: matrix.server_version != 'latest'
        env:
          SERVER_VERSION: ${{ matrix.server_version }}
        run: |
          set -e
          DEPLOY_DIR="${GITHUB_WORKSPACE}/.build/deploy"
          rm -rf "${DEPLOY_DIR}" || true
          mkdir -p "${DEPLOY_DIR}"

          # Download and extract the release blueprint
          UPSTREAM_REPO="nephio-project/porch"
          BLUEPRINT_URL="https://github.com/${UPSTREAM_REPO}/releases/download/${SERVER_VERSION}/porch_blueprint.tar.gz"
          echo "Downloading blueprint from ${BLUEPRINT_URL}"
          curl -fsSL "${BLUEPRINT_URL}" | tar -xz -C "${DEPLOY_DIR}"

          # Pull server images from registry and load into kind
          for IMG in porch-server porch-controllers porch-function-runner porch-wrapper-server; do
            echo "Pulling docker.io/nephio/${IMG}:${SERVER_VERSION}"
            docker pull "docker.io/nephio/${IMG}:${SERVER_VERSION}" || true
            kind load docker-image "docker.io/nephio/${IMG}:${SERVER_VERSION}" -n ${KIND_CONTEXT_NAME} || true
          done

          # Configure DB cache
          kpt fn eval "${DEPLOY_DIR}" \
            --image ghcr.io/kptdev/krm-functions-catalog/search-replace:v0.2 \
            --match-kind ConfigMap \
            --match-name porch-config \
            --match-namespace porch-system \
            -- by-path=data.cache-type put-value="DB" || true

          # Deploy using kpt
          kpt live init "${DEPLOY_DIR}" --name porch --namespace porch-system --inventory-id nephio || true
          kpt live apply --inventory-policy=adopt --server-side --force-conflicts "${DEPLOY_DIR}"
          kubectl rollout status deployment function-runner --namespace porch-system --timeout=120s 2>/dev/null || true
          kubectl rollout status deployment porch-controllers --namespace porch-system --timeout=120s 2>/dev/null || true
          kubectl rollout status deployment porch-server --namespace porch-system --timeout=120s 2>/dev/null || true
          echo "Server ${SERVER_VERSION} deployed with DB cache."

      # --- Download all CLI versions ---

      - name: Download latest CLI
        uses: actions/download-artifact@v4
        with:
          name: porchctl-latest
          path: .build/cli/latest/
      - name: Download released CLI versions
        run: |
          UPSTREAM_REPO="nephio-project/porch"
          for VERSION in $(echo "$RELEASES" | jq -r '.[]'); do
            VERSION_NUM="${VERSION#v}"
            CLI_URL="https://github.com/${UPSTREAM_REPO}/releases/download/${VERSION}/porchctl_${VERSION_NUM}_linux_amd64.tar.gz"
            echo "Downloading porchctl ${VERSION} from ${CLI_URL}"
            mkdir -p ".build/cli/${VERSION}"
            curl -fsSL "${CLI_URL}" | tar -xz -C ".build/cli/${VERSION}/"
          done
      - name: Make all CLI binaries executable
        run: |
          find .build/cli -name porchctl -exec chmod +x {} \;
          echo "Available CLI versions:"
          for d in .build/cli/*/; do
            VERSION=$(basename "$d")
            echo "  ${VERSION}: $("${d}porchctl" version 2>/dev/null || echo 'version check skipped')"
          done

      # --- Run CLI tests with each porchctl version sequentially ---

      - name: Run CLI tests with all porchctl versions
        id: run-tests
        run: |
          set +e
          mkdir -p .build/compat-results

          # Build list of CLI versions to test: latest + releases
          CLI_VERSIONS="latest $(echo "$RELEASES" | jq -r '.[]')"

          # Back up the current branch's test/e2e/cli directory and .build/porchctl
          CLI_TEST_DIR="${GITHUB_WORKSPACE}/test/e2e/cli"
          CLI_TEST_BACKUP="${GITHUB_WORKSPACE}/.build/cli-test-backup"
          cp -r "${CLI_TEST_DIR}" "${CLI_TEST_BACKUP}"
          PORCHCTL_ORIGINAL="${GITHUB_WORKSPACE}/.build/porchctl"

          UPSTREAM_REPO="nephio-project/porch"

          for CLI_VERSION in $CLI_VERSIONS; do
            echo ""
            echo "=============================================="
            echo "Testing CLI ${CLI_VERSION} against server ${{ matrix.server_version }}"
            echo "=============================================="

            if [ "${CLI_VERSION}" = "latest" ]; then
              # --- Latest: use current branch test code + PORCHCTL_PATH ---
              echo "[TEST CODE] Using current branch test code (latest)"
              rm -rf "${CLI_TEST_DIR}"
              cp -r "${CLI_TEST_BACKUP}" "${CLI_TEST_DIR}"

              PORCHCTL_BIN="${GITHUB_WORKSPACE}/.build/cli/${CLI_VERSION}/porchctl"
              LOG_FILE=".build/compat-results/test-${CLI_VERSION}.log"

              E2E=1 PORCHCTL_PATH="${PORCHCTL_BIN}" \
                go test -v -timeout 20m ./test/e2e/cli 2>&1 | tee "${LOG_FILE}"
              TEST_EXIT=${PIPESTATUS[0]}
            else
              # --- Released version: swap entire test/e2e/cli from upstream tag ---
              echo "[TEST CODE] Downloading test code from upstream tag ${CLI_VERSION}..."
              TARBALL_URL="https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${CLI_VERSION}.tar.gz"
              EXTRACT_DIR=$(mktemp -d)
              curl -fsSL "${TARBALL_URL}" | tar -xz -C "${EXTRACT_DIR}"
              VERSION_NUM="${CLI_VERSION#v}"
              EXTRACTED_CLI_TEST="${EXTRACT_DIR}/porch-${VERSION_NUM}/test/e2e/cli"

              if [ -d "${EXTRACTED_CLI_TEST}" ]; then
                rm -rf "${CLI_TEST_DIR}"
                cp -r "${EXTRACTED_CLI_TEST}" "${CLI_TEST_DIR}"
                echo "[TEST CODE] Swapped to ${CLI_VERSION} test code + testdata"
              else
                echo "[TEST CODE] WARNING: Could not find test/e2e/cli in ${CLI_VERSION} source, falling back to current branch"
                rm -rf "${CLI_TEST_DIR}"
                cp -r "${CLI_TEST_BACKUP}" "${CLI_TEST_DIR}"
              fi
              rm -rf "${EXTRACT_DIR}"

              # Copy the porchctl binary to .build/porchctl where the old harness expects it
              cp "${GITHUB_WORKSPACE}/.build/cli/${CLI_VERSION}/porchctl" "${PORCHCTL_ORIGINAL}"
              echo "[TEST CODE] Placed ${CLI_VERSION} porchctl at .build/porchctl"

              LOG_FILE=".build/compat-results/test-${CLI_VERSION}.log"

              E2E=1 go test -v -timeout 20m ./test/e2e/cli 2>&1 | tee "${LOG_FILE}"
              TEST_EXIT=${PIPESTATUS[0]}
            fi

            # Parse results
            RESULT="pass"
            FAILED_TESTS=""
            if [ $TEST_EXIT -ne 0 ]; then
              RESULT="fail"
              FAILED_TESTS=$(grep -E '^\s*--- FAIL:' "${LOG_FILE}" | sed 's/.*--- FAIL: //' | sed 's/ (.*//' | tr '\n' ',' | sed 's/,$//')
            fi

            # Write result JSON
            cat > ".build/compat-results/result-${CLI_VERSION}.json" <<EOJSON
          {
            "server_version": "${{ matrix.server_version }}",
            "cli_version": "${CLI_VERSION}",
            "result": "${RESULT}",
            "failed_tests": "${FAILED_TESTS}"
          }
          EOJSON

            echo "Result: ${RESULT}"
            echo "Failed tests: ${FAILED_TESTS}"
          done

          # Restore original test code
          rm -rf "${CLI_TEST_DIR}"
          cp -r "${CLI_TEST_BACKUP}" "${CLI_TEST_DIR}"
          echo "[TEST CODE] Restored current branch test code"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "compat-results-${{ matrix.server_version }}"
          path: .build/compat-results/
          retention-days: 5

      - name: Export porch server logs
        if: always()
        run: |
          name=$(kubectl -n porch-system get pod -l app=porch-server -o custom-columns=NAME:.metadata.name --no-headers=true 2>/dev/null || echo "")
          if [ -n "$name" ]; then
            kubectl -n porch-system logs "$name" > server.log 2>/dev/null || true
          fi
      - name: Archive server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "server-log-${{ matrix.server_version }}"
          path: server.log
          compression-level: 0
          retention-days: 2
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. Aggregate results into a compatibility matrix summary
  # ---------------------------------------------------------------------------
  compat-summary:
    name: Compatibility Matrix Summary
    if: always()
    needs: [resolve-versions, compat-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compat-results-*
          path: results/

      - name: Generate compatibility matrix
        run: |
          RELEASES='${{ needs.resolve-versions.outputs.releases }}'

          # Collect all result JSONs into a single array
          RESULTS=$(find results/ -name 'result-*.json' -exec cat {} \; | jq -s '.')

          # Build the markdown table
          CLI_VERSIONS=$(echo "$RELEASES" | jq -r '["latest"] + . | .[]')
          SERVER_VERSIONS=$(echo "$RELEASES" | jq -r '["latest"] + . | .[]')

          # Header
          HEADER="| Server ↓ \ CLI → |"
          SEP="|---|"
          for cv in $CLI_VERSIONS; do
            HEADER="${HEADER} ${cv} |"
            SEP="${SEP}---|"
          done

          {
            echo "## CLI Compatibility Matrix (DB Cache)"
            echo ""
            echo "$HEADER"
            echo "$SEP"

            for sv in $SERVER_VERSIONS; do
              ROW="| ${sv} |"
              for cv in $CLI_VERSIONS; do
                CELL=$(echo "$RESULTS" | jq -r --arg sv "$sv" --arg cv "$cv" '
                  map(select(.server_version == $sv and .cli_version == $cv)) |
                  if length == 0 then "⚪ N/A"
                  elif .[0].result == "pass" then "✅"
                  else
                    .[0].failed_tests as $ft |
                    if ($ft | length) > 0 then
                      "❌ " + ($ft | split(",") | map(split("/") | last) | .[0:3] | join(", ")) +
                      (if ($ft | split(",") | length) > 3 then " +" + (($ft | split(",") | length) - 3 | tostring) + " more" else "" end)
                    else "❌"
                    end
                  end
                ')
                ROW="${ROW} ${CELL} |"
              done
              echo "$ROW"
            done

            echo ""
            echo "- ✅ = All CLI tests passed"
            echo "- ❌ = One or more tests failed (failed test names shown)"
            echo "- ⚪ = Test did not run"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check for failures
        run: |
          # Fail the workflow if any test failed
          FAILED=$(find results/ -name 'result-*.json' -exec grep -l '"result": "fail"' {} \;)
          if [ -n "$FAILED" ]; then
            echo "::error::Some compatibility tests failed. See the matrix summary above."
            exit 1
          fi
